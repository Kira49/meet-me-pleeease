<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yo Ayush, Movie Date?</title>
  <style>
    :root {
      --bg-dark: #1d1027;
      --bg-mid: #371a4e;
      --bg-soft: #5e2c73;
      --text: #ffeef9;
      --text-dim: #f6d6eb;
      --card-border: rgba(255, 255, 255, 0.22);
      --good-1: #7dffbd;
      --good-2: #4bd48f;
      --bad-1: #ff91c4;
      --bad-2: #f05095;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    }

    body {
      min-height: 100dvh;
      display: grid;
      place-items: center;
      color: var(--text);
      background:
        radial-gradient(circle at 20% 20%, #7a3ea3 0%, transparent 35%),
        radial-gradient(circle at 80% 10%, #c8458e 0%, transparent 30%),
        linear-gradient(140deg, var(--bg-dark), var(--bg-mid), var(--bg-soft));
      overflow-x: hidden;
      overflow-y: auto;
      position: relative;
      padding: 0.75rem;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(circle, rgba(255, 255, 255, 0.22) 1px, transparent 1px);
      background-size: 22px 22px;
      opacity: 0.28;
      pointer-events: none;
      z-index: 0;
    }

    .float {
      position: absolute;
      font-size: 2rem;
      opacity: 0.23;
      animation: drift linear infinite;
      user-select: none;
      pointer-events: none;
      filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.25));
    }

    @keyframes drift {
      from { transform: translateY(120vh) rotate(0deg); }
      to { transform: translateY(-20vh) rotate(240deg); }
    }

    .card {
      width: min(92vw, 700px);
      background: linear-gradient(165deg, rgba(255, 255, 255, 0.17), rgba(255, 255, 255, 0.08));
      border: 1px solid var(--card-border);
      border-radius: 26px;
      box-shadow:
        0 20px 55px rgba(11, 0, 18, 0.55),
        inset 0 1px 0 rgba(255, 255, 255, 0.45);
      backdrop-filter: blur(9px);
      padding: clamp(1.2rem, 2.5vw, 2rem);
      text-align: center;
      position: relative;
      z-index: 5;
      overflow: hidden;
    }

    .card::after {
      content: "";
      position: absolute;
      width: 180px;
      height: 180px;
      right: -40px;
      top: -50px;
      background: radial-gradient(circle at 30% 30%, rgba(255, 155, 206, 0.65), transparent 70%);
      pointer-events: none;
    }

    h1 {
      font-size: clamp(1.9rem, 5vw, 2.9rem);
      margin-bottom: 0.7rem;
      line-height: 1.15;
      color: #ffd6ef;
      text-shadow: 0 3px 12px rgba(255, 120, 186, 0.45);
      letter-spacing: 0.2px;
    }

    p {
      font-size: clamp(1rem, 2.6vw, 1.2rem);
      color: var(--text-dim);
      margin-bottom: 1.1rem;
    }

    .movie {
      margin: 0.8rem auto 1.3rem;
      padding: 1rem 1.05rem;
      border-radius: 16px;
      background: rgba(22, 6, 36, 0.45);
      width: fit-content;
      min-width: min(90%, 390px);
      border: 1px solid rgba(255, 180, 228, 0.45);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.1);
    }

    .movie div {
      margin: 0.2rem 0;
    }

    .movie strong {
      color: #ff9ed2;
    }

    .buttons {
      min-height: 100px;
      position: relative;
      margin-top: 0.8rem;
    }

    .btn {
      border: none;
      border-radius: 999px;
      padding: 0.78rem 1.3rem;
      font-size: 1rem;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.25s ease, filter 0.2s ease;
      box-shadow: 0 10px 22px rgba(5, 1, 12, 0.5);
      font-weight: 800;
      position: relative;
      margin: 0.4rem;
      touch-action: manipulation;
      color: #1e1227;
    }

    .btn:active {
      transform: scale(0.98);
    }

    #yesBtn {
      background: linear-gradient(135deg, var(--good-1), var(--good-2));
      animation: pulse 1.6s ease-in-out infinite;
    }

    #yesBtn:hover {
      transform: translateY(-2px);
      filter: brightness(1.05);
    }

    #noBtn {
      background: linear-gradient(135deg, var(--bad-1), var(--bad-2));
      color: #fff5fb;
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
    }

    #noBtn:hover {
      filter: brightness(1.04);
    }

    .message {
      margin-top: 1.2rem;
      font-size: 1.15rem;
      min-height: 1.8em;
      font-weight: 800;
      color: #ffd3eb;
      text-shadow: 0 2px 8px rgba(19, 2, 31, 0.5);
    }

    .hidden {
      display: none;
    }

    #dateDetails {
      margin-top: 1rem;
      border-radius: 14px;
      padding: 0.92rem;
      font-weight: 600;
      background: linear-gradient(135deg, rgba(106, 255, 185, 0.18), rgba(255, 125, 200, 0.2));
      border: 1px solid rgba(255, 196, 234, 0.52);
    }

    #confettiCanvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 20;
    }

    .reveal {
      animation: popIn 0.4s ease;
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 10px 22px rgba(5, 1, 12, 0.5); }
      50% { box-shadow: 0 10px 30px rgba(97, 237, 165, 0.38); }
    }

    @keyframes popIn {
      0% { opacity: 0; transform: scale(0.94); }
      100% { opacity: 1; transform: scale(1); }
    }

    @media (max-width: 600px) {
      body {
        padding: 0.65rem;
      }

      .card {
        width: 100%;
        border-radius: 18px;
        padding: 1rem 0.9rem 1.1rem;
      }

      .movie {
        width: 100%;
        min-width: 0;
        font-size: 0.98rem;
      }

      .buttons {
        min-height: 132px;
      }

      .btn {
        width: 100%;
        margin: 0.32rem 0;
        min-height: 46px;
      }

      #noBtn {
        left: 0;
        top: 60px;
        transform: none;
      }
    }
  </style>
</head>
<body>
  <canvas id="confettiCanvas"></canvas>

  <span class="float" style="left:8%; animation-duration:12s;">🍿</span>
  <span class="float" style="left:20%; animation-duration:15s;">🎬</span>
  <span class="float" style="left:35%; animation-duration:11s;">✨</span>
  <span class="float" style="left:54%; animation-duration:14s;">💖</span>
  <span class="float" style="left:68%; animation-duration:10s;">🍫</span>
  <span class="float" style="left:84%; animation-duration:13s;">🎟️</span>

  <main class="card">
    <h1>Hey Ayush, guess what? 🎥</h1>
    <p>I finally picked a movie 😭</p>

    <div class="movie">
      <div><strong>Movie:</strong> The Drama</div>
      <div><strong>Mission:</strong> Be my date, don't be late 😌</div>
      <div><strong>Dress code:</strong> Leave your jacket at home, it's summer</div>
      <div><strong>Snacks:</strong> <s>You</s> Non-negotiable popcorn</div>
    </div>

    <p>So... are you in?</p>
    <section class="buttons" id="buttonsArea">
      <button class="btn" id="yesBtn" type="button">Yes, absolutely! 💚</button>
      <button class="btn" id="noBtn" type="button">No 🙈</button>
    </section>

    <div class="message" id="message"></div>
    <div id="dateDetails" class="hidden reveal">
      <div><strong>Venue:</strong> Nexus Shantiniketan</div>
      <div><strong>Time:</strong> Sunday, April 5, 7:45 pm </div>
    </div>
  </main>

  <script>
    const noBtn = document.getElementById("noBtn");
    const yesBtn = document.getElementById("yesBtn");
    const buttonsArea = document.getElementById("buttonsArea");
    const message = document.getElementById("message");
    const dateDetails = document.getElementById("dateDetails");

    let dodges = 0;

    function moveNoButton() {
      dodges += 1;
      const areaRect = buttonsArea.getBoundingClientRect();
      const btnRect = noBtn.getBoundingClientRect();
      const pad = 8;
      const maxX = Math.max(pad, areaRect.width - btnRect.width - pad);
      const maxY = Math.max(pad, areaRect.height - btnRect.height - pad);
      const x = pad + Math.random() * Math.max(0, maxX - pad);
      const y = pad + Math.random() * Math.max(0, maxY - pad);
      noBtn.style.left = `${x}px`;
      noBtn.style.top = `${y}px`;
      noBtn.style.transform = "none";

      if (dodges > 4) {
        message.textContent = "The No button is shy today.";
      }
    }

    ["mouseenter", "touchstart", "click"].forEach((eventName) => {
      noBtn.addEventListener(eventName, moveNoButton);
    });

    yesBtn.addEventListener("click", () => {
      message.textContent = "Yay! Ayush said YES. Ticket time! 🎉";
      dateDetails.classList.remove("hidden");
      launchConfetti();
      noBtn.classList.add("hidden");
      yesBtn.classList.add("hidden");
      buttonsArea.style.minHeight = "0";
    });

    const canvas = document.getElementById("confettiCanvas");
    const ctx = canvas.getContext("2d");
    let confetti = [];
    let hearts = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    function launchConfetti() {
      confetti = Array.from({ length: 180 }, () => ({
        x: Math.random() * canvas.width,
        y: -10 - Math.random() * canvas.height * 0.6,
        w: 5 + Math.random() * 8,
        h: 8 + Math.random() * 10,
        speed: 2 + Math.random() * 4,
        tilt: Math.random() * 10 - 5,
        color: ["#ff5c9f", "#ffd166", "#06d6a0", "#7b61ff", "#00b4d8"][Math.floor(Math.random() * 5)]
      }));
      hearts = Array.from({ length: 42 }, () => ({
        x: Math.random() * canvas.width,
        y: canvas.height + Math.random() * canvas.height * 0.3,
        size: 14 + Math.random() * 14,
        speed: 1.1 + Math.random() * 2,
        sway: Math.random() * 2.2,
        phase: Math.random() * Math.PI * 2,
        alpha: 0.65 + Math.random() * 0.35
      }));

      let frames = 0;
      function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        confetti.forEach((piece) => {
          piece.y += piece.speed;
          piece.x += Math.sin(piece.y * 0.02) + piece.tilt * 0.02;
          ctx.fillStyle = piece.color;
          ctx.fillRect(piece.x, piece.y, piece.w, piece.h);
        });
        hearts.forEach((heart) => {
          heart.y -= heart.speed;
          heart.x += Math.sin(frames * 0.06 + heart.phase) * heart.sway;
          ctx.globalAlpha = heart.alpha;
          ctx.font = `${heart.size}px "Segoe UI Emoji", "Apple Color Emoji", sans-serif`;
          ctx.fillText("💖", heart.x, heart.y);
        });
        ctx.globalAlpha = 1;

        frames += 1;
        if (frames < 220) {
          requestAnimationFrame(animate);
        } else {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
        }
      }

      animate();
    }
  </script>
</body>
</html>
